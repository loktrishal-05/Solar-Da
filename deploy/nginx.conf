# Single public port; routes mirror weiqou/web/vite.config.ts so the UI needs no change.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nb; proxy_temp_path /tmp/np; fastcgi_temp_path /tmp/nf; uwsgi_temp_path /tmp/nu; scgi_temp_path /tmp/ns;
  client_max_body_size 12m;
  server {
    listen 7860;
    root /app/web;
    location /agents/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 300s;   # SSE
    }
    location /vision/ { proxy_pass http://127.0.0.1:8200; proxy_read_timeout 120s; }
    location /api/    { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 300s; }
    location / { try_files $uri /index.html; }
  }
}
